[package]
name = "bitchain"
version = "0.2.0"
authors = ["Douglas Lockamy <dlockamy@lockamystudios.com>"]
edition = "2021"
description = "Content-addressed binary storage CLI — format v2 reference client over storage-kit's engine (BLAKE3 addressing, recursive fragmentation, Zstd-compressed packfiles, per-partition dedup), plus the manifest protocol and GC"
repository = "https://github.com/slash-builder/bitchain"
license = "Apache-2.0"
keywords = ["binary", "content-addressed", "packfile", "blake3", "storage"]
categories = ["command-line-utilities", "filesystem"]
# CLUS-42: this repo's Jenkinsfile sets CARGO_HOME=$WORKSPACE/.cargo and
# writes real Nexus credentials there for the publish step, then runs
# `cargo publish --allow-dirty` from that same directory -- which
# suppresses cargo's own "untracked files in the package root" warning.
# Without this exclude, .cargo/credentials.toml (and the downloaded
# registry cache) would ship inside the published crate, exactly as
# confirmed live in slash-builder/storage-kit 0.1.1 on Nexus. See that
# repo's fix/exclude-cargo-dir-from-package PR for the full incident.
# .cargo/config.toml itself (the Nexus registry index pointer,
# intentionally git-tracked, no secret) stays included.
exclude = [".cargo/credentials.toml", ".cargo/registry/", ".cargo/.package-cache", ".cargo/.package-cache-mutate", ".cargo/.global-cache"]

[lib]
name = "bitchain"
path = "src/lib.rs"

[[bin]]
name = "bitchain"
path = "src/main.rs"

[dependencies]
# The v2 storage engine (addressing, fragment, store/packfile) relocated to
# storage-kit 2026-08-23 (data-architect's ruling, CLUS-21: a location
# defect, not a shape defect); build-confirmed green 2026-08-25. This crate
# is now a thin CLI + manifest protocol layer over it. Both are same-org
# siblings under slash-builder now.
# Consumed from the Nexus `lockamy` registry, NOT a path. The migration the
# old NOTE here called for is done: storage-kit 2.0.0 was published to Nexus
# 2026-09-21 (it had never been -- the registry held only 0.1.0-0.1.3, so
# `version = "2.0"` had nothing to resolve to and the path dep was the only
# thing making this crate build at all).
#
# Do not reintroduce `path = "../storage-kit"`. Jenkins does a single-repo
# container checkout with no sibling, so a path dep fails resolution outright:
#   failed to load source for dependency `storage-kit`
#   ... /storage-kit/Cargo.toml: No such file or directory
# For local dev against an unpublished storage-kit, use a `[patch]` in
# .cargo/config.toml rather than editing this line.
storage-kit = { version = "2.0", registry = "lockamy" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
walkdir = "2"
# `Context` (src/context.rs) is now owned here rather than re-exported from
# storage-kit (2026-09-23 storage-addressing rulings; see that module's doc
# comment). blake3/hex were already pulled in transitively via storage-kit;
# these are the same versions storage-kit itself pins, made direct because
# this crate now derives and hex-encodes a Context itself.
blake3 = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
