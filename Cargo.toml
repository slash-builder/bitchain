[package]
name = "bitchain"
version = "0.2.0"
authors = ["Douglas Lockamy <dlockamy@lockamystudios.com>"]
edition = "2021"
description = "Content-addressed binary storage Kit — format v2: BLAKE3 addressing, recursive fragmentation, Zstd-compressed packfiles, per-partition dedup"
repository = "https://github.com/slash-builder/bitchain"
license = "Apache-2.0"
keywords = ["binary", "content-addressed", "packfile", "blake3", "storage"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "bitchain"
path = "src/lib.rs"

[[bin]]
name = "bitchain"
path = "src/main.rs"

[dependencies]
blake3 = "1"
zstd = "0.13"
fastcdc = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
